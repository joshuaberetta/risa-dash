name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uvx ruff check backend
      - name: Tests (PostGIS, GDAL and Typst in the dev image)
        run: |
          docker compose up -d --wait db
          docker compose run --rm -T web python -m pytest -q risa/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The production image with the internet cut off, as on an offline kobo-in-a-box
  e2e-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload, process, print page 1 and export with no network
        run: scripts/e2e.sh
