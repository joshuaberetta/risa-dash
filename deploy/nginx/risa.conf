# kobo-in-a-box edge nginx: http://risa.kobo.local -> the dashboard on :8000.
# Add to the box's edge config (remote/library/nginx/edge.conf) next to kf/kc/ee.
server {
    listen 80;
    server_name risa.*;

    # Orthomosaics are uploaded in 8 MB parts; allow a little headroom
    client_max_body_size 20m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
